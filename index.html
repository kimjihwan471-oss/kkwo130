<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title-tag">스윗 DJ 퀴즈</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #050b14 0%, #0a1128 50%, #101c3d 100%);
            color: #f1f5f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(56, 189, 248, 0.1);
            border-radius: 20px;
            padding: 30px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            max-height: 90vh;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 16px;
            background-color: rgba(30, 41, 59, 0.8);
            border: 1px solid #334155;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            margin-bottom: 12px;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus, select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            margin: 4px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.5);
        }

        .btn-secondary {
            background: rgba(51, 65, 85, 0.8);
            box-shadow: none;
        }
        .btn-secondary:hover {
            background: #475569;
            box-shadow: none;
        }

        .btn-danger {
            background: linear-gradient(135deg, #e11d48 0%, #be123c 100%);
            box-shadow: 0 4px 12px rgba(225, 29, 72, 0.3);
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .quiz-box {
            font-size: 1.1rem;
            margin-bottom: 20px;
            line-height: 1.5;
            color: #f8fafc;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: rgba(30, 41, 59, 0.9);
            border: 1px solid #334155;
            color: #f1f5f9;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            font-size: 0.95rem;
        }

        .option-btn:hover {
            background-color: rgba(56, 189, 248, 0.15);
            border-color: #38bdf8;
        }

        .admin-item {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            text-align: left;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 홈 화면 -->
        <div id="home-section" class="section active">
            <h1 id="main-title">스윗 DJ 퀴즈</h1>
            <p class="subtitle" id="main-subtitle">스윗에 대해 얼마나 알고 있을까요?</p>
            <input type="text" id="username" placeholder="스스로의 닉네임을 입력하세요">
            <div>
                <button class="btn" onclick="startQuiz()">퀴즈 시작</button>
                <button class="btn btn-secondary" onclick="showRanking()">현재 순위 보기</button>
                <button class="btn btn-secondary" onclick="showAdminLogin()">관리자 모드</button>
            </div>
        </div>

        <!-- 관리자 로그인 화면 (간이 비밀번호) -->
        <div id="admin-login-section" class="section">
            <h1>관리자 인증</h1>
            <p class="subtitle">관리자 비밀번호를 입력하세요 (기본: 1234)</p>
            <input type="password" id="admin-pw" placeholder="비밀번호">
            <div>
                <button class="btn" onclick="checkAdminPassword()">로그인</button>
                <button class="btn btn-secondary" onclick="goHome()">돌아가기</button>
            </div>
        </div>

        <!-- 관리자 대시보드 (모든 것 변경 가능) -->
        <div id="admin-section" class="section">
            <h1>관리자 대시보드</h1>
            <p class="subtitle">사이트 설정 및 퀴즈 데이터를 자유롭게 관리하세요.</p>
            
            <div style="text-align: left; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 15px;">
                <h3 style="color: #38bdf8; margin-bottom: 8px; font-size: 1rem;">⚙️ 사이트 기본 정보 변경</h3>
                <label style="font-size: 0.85rem; color: #94a3b8;">메인 타이틀</label>
                <input type="text" id="edit-site-title" value="스윗 DJ 퀴즈">
                <label style="font-size: 0.85rem; color: #94a3b8;">서브 타이틀</label>
                <input type="text" id="edit-site-subtitle" value="스윗에 대해 얼마나 알고 있을까요?">
                <button class="btn" onclick="saveSiteSettings()">설정 저장</button>
            </div>

            <div style="text-align: left; margin-bottom: 15px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                    <h3 style="color: #38bdf8; font-size: 1rem;">📝 퀴즈 문제 관리</h3>
                    <button class="btn" onclick="openQuestionModal()">+ 새 문제 추가</button>
                </div>
                <div id="admin-question-list" style="max-height: 250px; overflow-y: auto; padding-right: 5px;">
                    <!-- 문제 목록이 동적으로 들어감 -->
                </div>
            </div>

            <button class="btn btn-secondary" onclick="goHome()">메인으로 나가기</button>
        </div>

        <!-- 문제 추가/수정 팝업/영역 -->
        <div id="question-edit-section" class="section">
            <h1 id="modal-title">문제 추가</h1>
            <div style="text-align: left;">
                <input type="hidden" id="edit-q-index" value="-1">
                <label style="font-size: 0.85rem; color: #94a3b8;">질문 내용</label>
                <input type="text" id="q-text" placeholder="예: 스윗의 아이디는?">
                
                <label style="font-size: 0.85rem; color: #94a3b8;">보기 1</label>
                <input type="text" id="q-opt0" placeholder="보기 1 입력">
                <label style="font-size: 0.85rem; color: #94a3b8;">보기 2</label>
                <input type="text" id="q-opt1" placeholder="보기 2 입력">
                <label style="font-size: 0.85rem; color: #94a3b8;">보기 3</label>
                <input type="text" id="q-opt2" placeholder="보기 3 입력">
                <label style="font-size: 0.85rem; color: #94a3b8;">보기 4</label>
                <input type="text" id="q-opt3" placeholder="보기 4 입력">

                <label style="font-size: 0.85rem; color: #94a3b8;">정답 번호 선택</label>
                <select id="q-answer">
                    <option value="0">1번 보기</option>
                    <option value="1">2번 보기</option>
                    <option value="2">3번 보기</option>
                    <option value="3">4번 보기</option>
                </select>
            </div>
            <div style="margin-top: 15px;">
                <button class="btn" onclick="saveQuestionData()">저장하기</button>
                <button class="btn btn-secondary" onclick="showAdminDashboard()">취소</button>
            </div>
        </div>

        <!-- 퀴즈 화면 -->
        <div id="quiz-section" class="section">
            <h2 id="quiz-progress" style="color: #38bdf8; margin-bottom: 15px; font-size: 1.1rem;">1 / 10 현재 점수: 0</h2>
            <div class="quiz-box" id="quiz-question">문제가 여기에 표시됩니다.</div>
            <div class="options-list" id="quiz-options"></div>
        </div>

        <!-- 결과 화면 -->
        <div id="result-section" class="section">
            <h1>퀴즈 완료!</h1>
            <p class="subtitle" id="final-score-text">수고하셨습니다!</p>
            <button class="btn" onclick="showRanking()">순위 보기</button>
            <button class="btn btn-secondary" onclick="goHome()">처음으로</button>
        </div>

        <!-- 순위 화면 -->
        <div id="ranking-section" class="section">
            <h1>스윗 퀴즈 순위</h1>
            <div id="ranking-list" style="margin: 20px 0; color: #94a3b8; font-size: 0.95rem; max-height: 200px; overflow-y: auto;">
                등록된 순위가 없습니다.
            </div>
            <button class="btn btn-secondary" onclick="goHome()">처음으로</button>
        </div>
    </div>

    <script>
        // 기본 설정 및 초기 데이터 (브라우저 저장소에 없을 경우 기본값 사용)
        const defaultQuizData = [
            { question: "스윗의 아이디는?", options: ["kkwo130", "sweet_dj", "kimji_130", "dj_kkwo"], answer: 0 },
            { question: "스윗의 팬 수는?", options: ["50명", "73명", "100명", "120명"], answer: 1 },
            { question: "스윗은 평일 방송을 할까?", options: ["네", "아니요", "랜덤", "매일 함"], answer: 1 },
            { question: "스윗의 주 방송 요일은?", options: ["월화수", "수목금", "금토일", "주말 내내"], answer: 2 },
            { question: "스윗의 주 방송 시간은?", options: ["30분-1시간", "1시간-2시간", "2시간-3시간", "3시간 이상"], answer: 1 },
            { question: "금토일 방송을 못 하면 어떻게 할까?", options: ["그냥 넘어감", "주중 휴방", "평일로 방송대체", "시간 변경"], answer: 2 },
            { question: "평일에 대체 방송을 한다면 무슨 요일에 하나요?", options: ["월요일", "화요일", "수요일", "목요일"], answer: 1 },
            { question: "스윗의 첫방송일은?", options: ["2026/01/23", "2026/02/10", "2025/12/25", "2026/03/01"], answer: 0 },
            { question: "스윗의 좋아요 리액션은?", options: ["아구좋아~", "너무좋아!", "최고예요~", "하트 뿅뿅"], answer: 0 },
            { question: "스윗의 직업은?", options: ["크리에이터", "학생", "심리상담사", "디자이너"], answer: 2 }
        ];

        // 데이터 불러오기 (Local Storage 연동)
        function getQuizData() {
            let data = localStorage.getItem('sweetCustomQuizData');
            return data ? JSON.parse(data) : defaultQuizData;
        }

        function saveQuizData(data) {
            localStorage.setItem('sweetCustomQuizData', JSON.stringify(data));
        }

        function getSiteConfig() {
            let config = localStorage.getItem('sweetSiteConfig');
            return config ? JSON.parse(config) : { title: "스윗 DJ 퀴즈", subtitle: "스윗에 대해 얼마나 알고 있을까요?" };
        }

        function saveSiteConfigToStorage(config) {
            localStorage.setItem('sweetSiteConfig', JSON.stringify(config));
            applySiteConfig();
        }

        function applySiteConfig() {
            let config = getSiteConfig();
            document.getElementById('main-title').innerText = config.title;
            document.getElementById('main-subtitle').innerText = config.subtitle;
            document.getElementById('site-title-tag').innerText = config.title;
            document.getElementById('edit-site-title').value = config.title;
            document.getElementById('edit-site-subtitle').value = config.subtitle;
        }

        // 페이지 로드 시 설정 적용
        window.onload = function() {
            applySiteConfig();
        };

        let currentQuestionIndex = 0;
        let score = 0;
        let currentUsername = "";

        function switchSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
        }

        function startQuiz() {
            const name = document.getElementById('username').value;
            if(!name) {
                alert('닉네임을 입력해주세요!');
                return;
            }
            currentUsername = name;
            currentQuestionIndex = 0;
            score = 0;
            switchSection('quiz-section');
            loadQuestion();
        }

        function loadQuestion() {
            const quizData = getQuizData();
            if (currentQuestionIndex >= quizData.length) {
                endQuiz();
                return;
            }

            const q = quizData[currentQuestionIndex];
            document.getElementById('quiz-progress').innerText = `${currentQuestionIndex + 1} / ${quizData.length} 현재 점수: ${score}`;
            document.getElementById('quiz-question').innerText = q.question;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';

            q.options.forEach((optionText, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = `${index + 1}. ${optionText}`;
                btn.onclick = () => checkAnswer(index, q.answer);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex, correctIndex) {
            if (selectedIndex === correctIndex) {
                score += 10;
            }
            currentQuestionIndex++;
            loadQuestion();
        }

        function endQuiz() {
            const quizData = getQuizData();
            const maxScore = quizData.length * 10;
            document.getElementById('final-score-text').innerText = `${currentUsername}님, 획득 점수: ${score}점 / ${maxScore}점`;
            switchSection('result-section');
            saveScoreToRanking(currentUsername, score);
        }

        function saveScoreToRanking(name, userScore) {
            let rankings = JSON.parse(localStorage.getItem('sweetQuizRankings') || '[]');
            rankings.push({ name: name, score: userScore });
            rankings.sort((a, b) => b.score - a.score);
            localStorage.setItem('sweetQuizRankings', JSON.stringify(rankings));
        }

        function showRanking() {
            switchSection('ranking-section');
            let rankings = JSON.parse(localStorage.getItem('sweetQuizRankings') || '[]');
            const rankingListEl = document.getElementById('ranking-list');
            
            if (rankings.length === 0) {
                rankingListEl.innerHTML = '등록된 순위가 없습니다.';
                return;
            }

            let html = '<ol style="text-align: left; display: inline-block; padding-left: 20px;">';
            rankings.forEach((r) => {
                html += `<li style="margin-bottom: 6px;"><b>${r.name}</b> — ${r.score}점</li>`;
            });
            html += '</ol>';
            rankingListEl.innerHTML = html;
        }

        // 관리자 모드 관련 로직
        function showAdminLogin() {
            document.getElementById('admin-pw').value = '';
            switchSection('admin-login-section');
        }

        function checkAdminPassword() {
            const pw = document.getElementById('admin-pw').value;
            if (pw === '1220') { // 원하시는 비밀번호로 변경 가능
                showAdminDashboard();
            } else {
                alert('비밀번호가 틀렸습니다!');
            }
        }

        function showAdminDashboard() {
            switchSection('admin-section');
            renderAdminQuestionList();
        }

        function saveSiteSettings() {
            const title = document.getElementById('edit-site-title').value;
            const subtitle = document.getElementById('edit-site-subtitle').value;
            saveSiteConfigToStorage({ title, subtitle });
            alert('사이트 정보가 성공적으로 변경되었습니다!');
        }

        function renderAdminQuestionList() {
            const quizData = getQuizData();
            const listEl = document.getElementById('admin-question-list');
            listEl.innerHTML = '';

            quizData.forEach((q, idx) => {
                let div = document.createElement('div');
                div.className = 'admin-item';
                div.innerHTML = `
                    <div style="font-weight: bold; margin-bottom: 4px; color: #38bdf8;">Q${idx+1}. ${q.question}</div>
                    <div style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 8px;">정답: ${q.options[q.answer]}</div>
                    <button class="btn" style="padding: 4px 10px; font-size: 0.8rem;" onclick="editQuestion(${idx})">수정</button>
                    <button class="btn btn-danger" style="padding: 4px 10px; font-size: 0.8rem;" onclick="deleteQuestion(${idx})">삭제</button>
                `;
                listEl.appendChild(div);
            });
        }

        function openQuestionModal(index = -1) {
            document.getElementById('edit-q-index').value = index;
            if (index === -1) {
                document.getElementById('modal-title').innerText = "새 문제 추가";
                document.getElementById('q-text').value = "";
                document.getElementById('q-opt0').value = "";
                document.getElementById('q-opt1').value = "";
                document.getElementById('q-opt2').value = "";
                document.getElementById('q-opt3').value = "";
                document.getElementById('q-answer').value = "0";
            } else {
                document.getElementById('modal-title').innerText = "문제 수정";
                const quizData = getQuizData();
                const q = quizData[index];
                document.getElementById('q-text').value = q.question;
                document.getElementById('q-opt0').value = q.options[0] || "";
                document.getElementById('q-opt1').value = q.options[1] || "";
                document.getElementById('q-opt2').value = q.options[2] || "";
                document.getElementById('q-opt3').value = q.options[3] || "";
                document.getElementById('q-answer').value = q.answer;
            }
            switchSection('question-edit-section');
        }

        function editQuestion(index) {
            openQuestionModal(index);
        }

        function saveQuestionData() {
            const index = parseInt(document.getElementById('edit-q-index').value);
            const question = document.getElementById('q-text').value;
            const options = [
                document.getElementById('q-opt0').value,
                document.getElementById('q-opt1').value,
                document.getElementById('q-opt2').value,
                document.getElementById('q-opt3').value
            ];
            const answer = parseInt(document.getElementById('q-answer').value);

            if (!question || options.some(opt => !opt)) {
                alert('질문과 모든 보기를 빠짐없이 입력해주세요!');
                return;
            }

            let quizData = getQuizData();
            const newQuestionObj = { question, options, answer };

            if (index === -1) {
                quizData.push(newQuestionObj);
            } else {
                quizData[index] = newQuestionObj;
            }

            saveQuizData(quizData);
            alert('저장되었습니다!');
            showAdminDashboard();
        }

        function deleteQuestion(index) {
            if (confirm('정말 이 문제를 삭제하시겠습니까?')) {
                let quizData = getQuizData();
                quizData.splice(index, 1);
                saveQuizData(quizData);
                renderAdminQuestionList();
            }
        }

        function goHome() {
            switchSection('home-section');
        }
    </script>
</body>
</html>
